<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0A84FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/jpeg" href="Icona_finale.jpg">
<link rel="apple-touch-icon" href="Icona_finale.jpg">
<meta name="apple-mobile-web-app-title" content="Scheda Palestra">
<title>Palestra Alberto</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #111; --bg2: #1c1c1e; --bg3: #2c2c2e; --bg4: #3a3a3c;
  --text: #fff; --text2: #aeaeb2;
  --accent: #0A84FF; --lordosi: #FF9F0A; --done: #30D158; --danger: #FF453A; --warm: #FF6B35;
  --spalla: #5AC8FA; --golf: #32D74B; --superset: #BF5AF2;
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow-x: hidden; }
body { max-width: 480px; margin: 0 auto; }

/* HEADER */
.hdr {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg2); padding: 10px 16px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--bg3); min-height: 48px;
}
.hdr-title { font-size: 17px; font-weight: 600; flex: 1; text-align: center; }
.hdr-left, .hdr-right { min-width: 60px; }
.hdr-right { text-align: right; }
.btn-back { background: none; border: none; color: var(--accent); font-size: 15px; cursor: pointer; padding: 4px 0; }
.s-timer { font-size: 14px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.s-timer.over { color: var(--danger); }

/* HOME */
#s-home { padding: 28px 16px 100px; }
.home-hero { text-align: center; margin-bottom: 28px; }
.home-hero h1 { font-size: 26px; font-weight: 800; }
.home-hero p { color: var(--text2); margin-top: 6px; font-size: 13px; }
.day-card {
  display: block; width: 100%; background: var(--bg2); border: 1.5px solid var(--bg3);
  border-radius: 18px; padding: 22px 18px; margin-bottom: 14px;
  cursor: pointer; text-align: left; color: var(--text);
}
.day-card:active { border-color: var(--accent); }
.day-card h2 { font-size: 20px; font-weight: 700; margin-bottom: 3px; }
.day-card .dsub { color: var(--text2); font-size: 13px; }
.day-card .dmeta { margin-top: 10px; font-size: 13px; color: var(--accent); }
.btn-prog {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; background: var(--bg2); border: 1.5px solid var(--bg3);
  border-radius: 18px; padding: 18px; margin-top: 4px; margin-bottom: 14px;
  cursor: pointer; color: var(--text); font-size: 16px; font-weight: 600;
}
.btn-prog:active { border-color: var(--done); color: var(--done); }
.info-box { background: var(--bg2); border-radius: 14px; padding: 14px 16px; font-size: 13px; color: var(--text2); line-height: 1.6; }

/* LISTA */
#s-list { padding: 0 0 100px; }
.sec-hdr { padding: 12px 16px 5px; font-size: 11px; font-weight: 700; letter-spacing: .8px; color: var(--text2); text-transform: uppercase; }
.ex-row {
  display: flex; align-items: center; padding: 13px 16px;
  border-bottom: 1px solid var(--bg3); cursor: pointer;
}
.ex-row:active { background: var(--bg2); }
.ex-row.done { opacity: .45; }
.ex-row.current { background: #0A84FF15; }
.er-num { font-size: 12px; color: var(--text2); width: 22px; flex-shrink: 0; }
.er-info { flex: 1; }
.er-name { font-size: 15px; font-weight: 500; }
.er-detail { font-size: 12px; color: var(--text2); margin-top: 2px; }
.er-badges { display: flex; gap: 5px; margin-top: 4px; flex-wrap: wrap; }
.bl { background: var(--lordosi); color: #000; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
.bw { background: var(--warm); color: #000; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
.er-check { font-size: 18px; margin-left: 6px; }
.ex-row.skipped { opacity: .55; font-style: italic; }
.bs-skip { background: var(--text2); color: #000; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }

/* ESERCIZIO */
#s-exercise { padding: 0 0 130px; }
.ex-hdr { padding: 18px 16px 12px; border-bottom: 1px solid var(--bg3); }
.ex-hdr h2 { font-size: 22px; font-weight: 700; line-height: 1.2; }
.ex-note { color: var(--text2); font-size: 13px; margin-top: 7px; line-height: 1.5; }
.bdg-row { display: flex; gap: 7px; margin-top: 9px; flex-wrap: wrap; }
.bl-lg { background: var(--lordosi); color: #000; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 6px; }
.bw-lg { background: var(--warm); color: #000; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 6px; }
.ex-body { padding: 14px 16px; }

/* Serie counter */
.series-block { background: var(--bg2); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.sl { font-size: 11px; color: var(--text2); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
.sc { display: flex; align-items: center; justify-content: space-between; }
.sd { font-size: 30px; font-weight: 700; flex: 1; text-align: center; }
.sd span { color: var(--accent); }
.cbtn { width: 50px; height: 50px; border-radius: 50%; border: none; background: var(--bg3); color: var(--text); font-size: 22px; cursor: pointer; }
.cbtn:active { background: var(--accent); }

/* Card riga */
.info-row { display: flex; gap: 10px; margin-bottom: 12px; }
.ic { flex: 1; background: var(--bg2); border-radius: 14px; padding: 12px; }
.ic-lbl { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 5px; }
.ic-val { font-size: 20px; font-weight: 700; }
.ic-val input {
  width: 100%; background: none; border: none; border-bottom: 1.5px solid var(--accent);
  color: var(--text); font-size: 20px; font-weight: 700; outline: none; font-family: inherit; padding-bottom: 1px;
}
.ic-unit { font-size: 11px; color: var(--text2); margin-top: 3px; }
.peso-storia { font-size: 11px; color: var(--done); margin-top: 2px; }

/* Fine serie */
.btn-fs {
  width: 100%; padding: 17px; border: none; border-radius: 14px;
  background: var(--accent); color: #fff; font-size: 17px; font-weight: 700;
  cursor: pointer; margin-bottom: 12px;
}
.btn-fs:active { opacity: .8; }
.btn-fs:disabled { background: var(--bg3); color: var(--text2); }

/* Riposo */
.rest-block { background: var(--bg2); border-radius: 16px; padding: 18px 16px; margin-bottom: 12px; display: none; text-align: center; }
.rest-block.active { display: block; }
.rl { font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
.rt { font-size: 68px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--accent); line-height: 1; }
.rt.ending { color: var(--danger); }
.rp { height: 5px; background: var(--bg3); border-radius: 3px; margin: 10px 0; overflow: hidden; }
.rpb { height: 100%; background: var(--accent); border-radius: 3px; transition: width .5s linear; }
.btn-skip { background: none; border: 1.5px solid var(--bg3); color: var(--text2); padding: 9px 22px; border-radius: 10px; font-size: 14px; cursor: pointer; margin-top: 6px; }

/* Timer esercizio (countdown / cronometro) */
.ex-timer-block { background: var(--bg2); border-radius: 16px; padding: 18px 16px; margin-bottom: 12px; text-align: center; border: 1.5px solid var(--accent); }
.ex-timer-display { font-size: 56px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--accent); line-height: 1; margin: 8px 0 14px; }
.ex-timer-display.zero { color: var(--danger); }
.btn-extimer { width: 100%; padding: 14px; border: none; border-radius: 12px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
.btn-extimer:active { opacity: .8; }

/* Salta esercizio */
.skip-block { margin-bottom: 12px; }
.btn-skip-ex { background: none; border: none; color: var(--text2); font-size: 13px; cursor: pointer; padding: 8px 0; text-decoration: underline; }
.skip-form { background: var(--bg2); border-radius: 14px; padding: 14px; margin-top: 6px; }
.skip-form textarea {
  width: 100%; background: var(--bg3); border: none; border-radius: 10px; color: var(--text);
  font-family: inherit; font-size: 14px; padding: 10px; resize: vertical; min-height: 60px;
}
.skip-form-actions { display: flex; gap: 8px; margin-top: 10px; }
.skip-done-note { background: var(--bg2); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; font-size: 13px; color: var(--text2); }
.btn-undo-skip { background: none; border: none; color: var(--accent); font-size: 13px; cursor: pointer; margin-left: 8px; text-decoration: underline; }

/* Reset scheda */
.btn-reset-scheda { background: none; border: 1.5px solid var(--danger); color: var(--danger); padding: 12px 24px; border-radius: 12px; font-size: 14px; cursor: pointer; }

/* Video + Info buttons */
.ex-actions { display: flex; gap: 10px; margin-bottom: 12px; }
.btn-vid {
  flex: 1; padding: 13px; border: 1.5px solid var(--bg3);
  border-radius: 14px; background: var(--bg2); color: var(--text);
  font-size: 15px; cursor: pointer; text-align: center;
  text-decoration: none; display: block;
}
.btn-vid:active { border-color: var(--accent); }
.btn-info {
  flex: 1; padding: 13px; border: 1.5px solid var(--bg3);
  border-radius: 14px; background: var(--bg2); color: var(--text);
  font-size: 15px; cursor: pointer; text-align: center;
}
.btn-info:active { border-color: var(--accent); }

/* Info drawer */
.info-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.65);
  z-index: 300; display: flex; align-items: flex-end;
}
.info-overlay.hidden { display: none !important; }
.info-drawer {
  background: var(--bg2); border-radius: 20px 20px 0 0;
  padding: 20px 20px 48px; max-height: 80vh; overflow-y: auto;
  width: 100%; max-width: 480px; margin: 0 auto;
  animation: slideUp .22s ease;
}
@keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.info-drawer-hdr { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
.info-drawer-title { font-size: 19px; font-weight: 700; color: var(--accent); flex: 1; margin-right: 12px; line-height: 1.25; }
.info-drawer-close { background: var(--bg3); border: none; color: var(--text); font-size: 20px; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.info-muscoli { font-size: 13px; color: var(--text2); margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--bg3); }
.info-steps { list-style: none; padding: 0; margin: 0; }
.info-steps li { padding: 10px 0; border-bottom: 1px solid var(--bg3); font-size: 14px; line-height: 1.55; display: flex; gap: 10px; }
.info-steps li:last-child { border-bottom: none; }
.step-n { color: var(--accent); font-weight: 700; flex-shrink: 0; min-width: 22px; }
.info-steps li.lordosi-step { color: var(--lordosi); }
.info-steps li.lordosi-step .step-n { color: var(--lordosi); }
.info-steps li.tecnica-step { color: var(--accent); }
.info-steps li.tecnica-step .step-n { color: var(--accent); }
.banner-warn { background: rgba(255,159,10,.12); border: 1.5px solid var(--lordosi); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; font-size: 13px; color: var(--lordosi); line-height: 1.5; }

/* Prossimo esercizio */
.next-ex-block { background: var(--bg2); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; border-left: 3px solid var(--bg4); }
.ne-lbl { font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 4px; }
.ne-name { font-size: 15px; font-weight: 600; }
.ne-muscoli { font-size: 12px; color: var(--text2); margin-top: 2px; }

/* Riposo adjustable */
.riposo-adj { display: flex; align-items: center; justify-content: space-between; background: var(--bg2); border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; }
.riposo-adj-lbl { font-size: 12px; color: var(--text2); }
.riposo-adj-btns { display: flex; align-items: center; gap: 10px; }
.btn-riposo-adj { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--bg4); background: var(--bg3); color: var(--text); font-size: 20px; cursor: pointer; line-height: 1; }
.riposo-adj-val { font-size: 16px; font-weight: 700; min-width: 44px; text-align: center; }
.btn-plus15 { background: var(--bg3); border: 1.5px solid var(--bg4); color: var(--text); padding: 9px 22px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 8px; }
.btn-plus15:active { background: var(--bg4); }

/* Nav bar fissa */
.nav-bar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px;
  display: flex; gap: 10px; padding: 10px 16px 22px;
  background: var(--bg); border-top: 1px solid var(--bg3);
}
.nb { flex: 1; padding: 15px; border: none; border-radius: 12px; background: var(--bg2); color: var(--text); font-size: 15px; font-weight: 600; cursor: pointer; }
.nb.primary { background: var(--accent); color: #fff; }
.nb:active { opacity: .8; }
.nb:disabled { opacity: .3; }

/* Toast */
.toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
  background: var(--done); color: #000; padding: 10px 22px;
  border-radius: 50px; font-size: 14px; font-weight: 700;
  opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 999; white-space: nowrap;
}
.toast.show { opacity: 1; }

/* Fine allenamento */
.w-done { text-align: center; padding: 44px 20px; display: none; }
.w-done.show { display: block; }
.w-done h2 { font-size: 28px; font-weight: 800; margin-bottom: 10px; }
.w-done p { color: var(--text2); font-size: 15px; line-height: 1.6; }
.btn-home-go { display: inline-block; margin-top: 28px; padding: 15px 36px; background: var(--accent); color: #fff; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; }

/* ===== PROGRESSI ===== */
#s-progress { padding: 0 0 80px; }
.prog-tabs { display: flex; gap: 8px; padding: 14px 16px 8px; }
.ptab {
  flex: 1; padding: 9px; border: 1.5px solid var(--bg3); border-radius: 10px;
  background: var(--bg2); color: var(--text2); font-size: 13px; font-weight: 600;
  cursor: pointer; text-align: center;
}
.ptab.active { border-color: var(--accent); color: var(--accent); }
.prog-list { padding: 0 16px; }
.prog-card {
  background: var(--bg2); border-radius: 14px; padding: 14px;
  margin-bottom: 10px; cursor: pointer;
}
.prog-card:active { opacity: .8; }
.pc-name { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.pc-meta { font-size: 12px; color: var(--text2); margin-bottom: 8px; }
.pc-latest { font-size: 22px; font-weight: 800; color: var(--accent); display: inline; }
.pc-delta { font-size: 12px; margin-left: 6px; }
.pc-delta.up { color: var(--done); }
.pc-delta.down { color: var(--danger); }
.pc-delta.same { color: var(--text2); }
.sparkline { margin-top: 8px; }

/* Dettaglio esercizio progressi */
.prog-detail { padding: 0 16px 80px; display: none; }
.prog-detail.show { display: block; }
.pd-chart { background: var(--bg2); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.pd-chart-title { font-size: 13px; color: var(--text2); margin-bottom: 12px; }
.pd-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.pd-table th { color: var(--text2); text-align: left; padding: 6px 4px; font-weight: 600; border-bottom: 1px solid var(--bg3); }
.pd-table td { padding: 8px 4px; border-bottom: 1px solid var(--bg3); }
.pd-table tr:last-child td { border-bottom: none; }
.pd-empty { text-align: center; color: var(--text2); padding: 32px; font-size: 14px; }

/* Reset pesi btn */
.btn-reset { background: none; border: 1.5px solid var(--danger); color: var(--danger); padding: 10px 20px; border-radius: 10px; font-size: 13px; cursor: pointer; margin-top: 8px; }

/* ===== V2 ===== */
/* Badge spalla / golf / superset */
.bsp { background: var(--spalla); color: #000; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
.bgo { background: var(--golf); color: #000; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
.bss { background: var(--superset); color: #000; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
.bsp-lg { background: var(--spalla); color: #000; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 6px; }
.bgo-lg { background: var(--golf); color: #000; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 6px; }
.bss-lg { background: var(--superset); color: #000; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 6px; }
.info-steps li.spalla-step, .info-steps li.spalla-step .step-n { color: var(--spalla); }
.info-steps li.golf-step, .info-steps li.golf-step .step-n { color: var(--golf); }
.er-prog { font-size: 12px; color: var(--accent); font-weight: 700; margin-left: 6px; }

/* Superset */
.superset-block { background: rgba(191,90,242,.12); border: 1.5px solid var(--superset); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; line-height: 1.45; }
.superset-block .ne-lbl { color: var(--superset); }

/* Countdown esercizi a tempo */
.cd-input {
  width: 140px; background: var(--bg3); border: 1.5px solid var(--bg4); border-radius: 14px;
  color: var(--text); font-family: inherit; font-size: 48px; font-weight: 800; text-align: center;
  padding: 6px 0; outline: none; font-variant-numeric: tabular-nums; margin-top: 6px;
}
.cd-input:focus { border-color: var(--accent); }
.cd-unit { font-size: 12px; color: var(--text2); margin: 4px 0 14px; }
.cd-actions { display: flex; flex-direction: column; gap: 8px; }
.cd-actions.row { flex-direction: row; justify-content: center; gap: 12px; }
.btn-extimer.secondary { background: var(--bg3); color: var(--text); }
.btn-plus15.big { font-size: 20px; padding: 14px 30px; margin-top: 0; border-color: var(--accent); color: var(--accent); }
.cd-actions.row .btn-skip { margin-top: 0; padding: 14px 26px; font-size: 15px; }
.cd-done { color: var(--done); font-weight: 700; font-size: 15px; padding: 8px 0; }

/* Filtro progressi */
.filter-row { display: flex; gap: 6px; padding: 0 16px 12px; }
.fchip { flex: 1; padding: 7px 4px; border: 1px solid var(--bg3); border-radius: 50px; background: none; color: var(--text2); font-size: 12px; cursor: pointer; text-align: center; font-family: inherit; }
.fchip.active { background: var(--bg3); color: var(--text); border-color: var(--bg4); }

/* Health Connect */
.hc-block { background: var(--bg2); border-radius: 14px; padding: 14px; margin: 18px 16px 0; }
.hc-row { display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 600; }
.hc-note { font-size: 12px; color: var(--text2); margin-top: 8px; line-height: 1.5; }
.switch { appearance: none; -webkit-appearance: none; width: 46px; height: 28px; border-radius: 14px; background: var(--bg4); position: relative; flex-shrink: 0; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--text2); transition: left .2s; }
.switch:checked { background: var(--done); }
.switch:checked::after { left: 21px; background: #fff; }
.switch:disabled { opacity: .5; }

/* Caricamento + sync */
.loading { text-align: center; color: var(--text2); padding: 120px 20px; font-size: 15px; }
.loading .big { font-size: 44px; margin-bottom: 14px; }
.sync-line { text-align: center; font-size: 12px; color: var(--text2); margin-top: 14px; }

.hidden { display: none !important; }
</style>
</head>
<body>

<div class="hdr" id="app-hdr">
  <div class="hdr-left"><button class="btn-back hidden" id="btn-back">←</button></div>
  <div class="hdr-title" id="hdr-title">Palestra Alberto</div>
  <div class="hdr-right"><span class="s-timer hidden" id="s-timer">0:00</span></div>
</div>

<div id="s-home"><div class="loading"><div class="big">💪</div>Caricamento scheda…</div></div>
<div id="s-list"  class="hidden"></div>
<div id="s-exercise" class="hidden"></div>
<div id="s-progress" class="hidden"></div>

<div class="toast" id="toast"></div>

<div class="info-overlay hidden" id="info-overlay" onclick="chiudiInfo()">
  <div class="info-drawer" id="info-drawer" onclick="event.stopPropagation()"></div>
</div>

<script>
// =========================================================
// CONFIG SUPABASE
// =========================================================
// Inserisci le credenziali del progetto (Supabase → Project Settings → API).

function fetchJSON(url) {
  return fetch(url).then(r => { if (!r.ok) throw new Error(url + ' ' + r.status); return r.json(); });
}

async function loadScheda() {
  try {
    const [scheda, info] = await Promise.all([
      fetchJSON('./scheda_v2.json'),
      fetchJSON('./esercizi_info.json')
    ]);
    SCHEDA = scheda;
    ESERCIZI_INFO = info;
    lsSet('p2_scheda_cache', { scheda, info });
  } catch (e) {
    // Offline: il service worker serve i JSON dalla cache. Se anche lui fallisce
    // (es. primissimo avvio offline) usa l'ultima copia salvata in localStorage.
    const c = lsGet('p2_scheda_cache', null);
    if (!c) {
      document.getElementById('s-home').innerHTML = `
        <div class="loading"><div class="big">📡</div>Impossibile caricare la scheda.<br>Controlla la connessione.<br><br>

function lsSet(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { console.warn('localStorage non scrivibile', k, e); }
}

function isoLocale(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function oggi() { return isoLocale(new Date()); }
function giorniFa(n) { const d = new Date(); d.setDate(d.getDate() - n); return isoLocale(d); }

function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 3 | 8)).toString(16);
  });
}

function registraStoria(exId, valore, rip, serie) {
  const st = loadStoria();
  if (!st[exId]) st[exId] = [];
  // Se c'è già una voce per oggi, aggiorna
  const todayIdx = st[exId].findIndex(r => r.data === oggi());
  const entry = { data: oggi(), peso: String(valore), rip: String(rip == null ? '' : rip), serie };
  if (todayIdx >= 0) st[exId][todayIdx] = entry;
  else st[exId].unshift(entry); // più recente in testa
  // max 30 sessioni per esercizio
  st[exId] = st[exId].slice(0, 30);
  saveStoria(st);
}

// =========================================================
// SYNC SUPABASE — coda locale, inviata appena c'è rete
// =========================================================
// Ogni scrittura va prima in coda (localStorage) e poi viene inviata.
// Online parte subito; offline resta "da sincronizzare" fino alla riconnessione.
let SB = null, syncInCorso = false;

function loadQ() { return lsGet('p2_syncq', []); }
function saveQ(q) { lsSet('p2_syncq', q); }

function accoda(table, row) {
  const q = loadQ();
  const i = q.findIndex(x => x.table === table && x.row.id === row.id);
  if (i >= 0) q[i].row = row; // es. sessione con durata aggiornata
  else q.push({ table, row });
  saveQ(q);
  sincronizza();
}

async function sincronizza() {
  if (!SB || syncInCorso || !navigator.onLine) { aggiornaStatoSync(); return; }
  syncInCorso = true;
  try {
    let q = loadQ();
    // in ordine: la sessione deve esistere prima delle sue serie (foreign key)
    while (q.length) {
      const item = q[0];
      const inviato = JSON.stringify(item.row);
      const { error } = await SB.from(item.table).upsert(item.row);
      if (error) { console.warn('Sync fallito', item.table, error.message); break; }
      q = loadQ();
      // se nel frattempo la riga è stata aggiornata, la lascio in coda per reinviarla
      if (q.length && JSON.stringify(q[0].row) === inviato) { q.shift(); saveQ(q); }
    }
  } catch (e) {
    console.warn('Sync fallito', e);
  } finally {
    syncInCorso = false;
    aggiornaStatoSync();
  }
}

function initSync() {
  if (!SUPABASE_ON) return;
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
  s.onload = () => {
    SB = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    sincronizza();
  };
  s.onerror = () => console.warn('Supabase non caricato (offline?) — uso solo localStorage');
  document.head.appendChild(s);
  window.addEventListener('online', sincronizza);
  window.addEventListener('offline', aggiornaStatoSync);
}

function statoSyncHTML() {
  if (!SUPABASE_ON) return `<div class="sync-line" id="sync-line">💾 Solo su questo telefono (cloud non configurato)</div>`;
  const n = loadQ().length;
  const txt = n ? `☁️ ${n} da sincronizzare${navigator.onLine ? '' : ' · offline'}` : '☁️ Tutto sincronizzato';
  return `<div class="sync-line" id="sync-line">${txt}</div>`;
}
function aggiornaStatoSync() {
  const el = document.getElementById('sync-line');
  if (el) el.outerHTML = statoSyncHTML();
}

// Progressi dal cloud → unisce allo storico locale (che resta la cache offline)
async function aggiornaDaCloud() {
  if (!SB || !navigator.onLine) return false;
  try {
    await sincronizza();
    const [serie, salti] = await Promise.all([
      SB.from('serie_log')
        .select('esercizio_id, serie_num, peso_kg, rip_effettive, durata_sec, creato_at, sessioni(data)')
        .or('peso_kg.not.is.null,durata_sec.not.is.null')
        .order('creato_at', { ascending: false })
        .limit(1000),
      SB.from('salti_log').select('*').eq('user_id', USER_ID)
        .order('creato_at', { ascending: false }).limit(200)
    ]);
    if (serie.error) throw serie.error;
    if (salti.error) throw salti.error;

    // una voce per esercizio/giorno: valore dell'ultima serie del giorno (come lo storico locale)
    const remota = {};
    serie.data.forEach(r => {
      const val = r.peso_kg != null ? r.peso_kg : r.durata_sec;
      if (val == null || !r.sessioni) return;
      const h = remota[r.esercizio_id] || (remota[r.esercizio_id] = []);
      const e = h.find(x => x.data === r.sessioni.data);
      if (!e) h.push({ data: r.sessioni.data, peso: String(val), rip: r.rip_effettive != null ? String(r.rip_effettive) : '', serie: r.serie_num });
      else e.serie = Math.max(e.serie, r.serie_num);
    });
    const locale = loadStoria();
    Object.entries(remota).forEach(([exId, h]) => {
      const perData = {};
      (locale[exId] || []).forEach(e => { perData[e.data] = e; });
      // oggi vince il locale (sessione in corso), gli altri giorni il cloud
      h.forEach(e => { if (e.data !== oggi() || !perData[e.data]) perData[e.data] = e; });
      locale[exId] = Object.values(perData).sort((a, b) => b.data.localeCompare(a.data)).slice(0, 30);
    });
    saveStoria(locale);

    const log = loadSkipLog();
    const ids = new Set(log.map(s => s.id).filter(Boolean));
    salti.data.forEach(s => {
      if (!ids.has(s.id)) log.push({ id: s.id, data: s.data, giorno: s.giorno, exId: s.esercizio_id, nome: s.esercizio_nome, nota: s.nota || '' });
    });
    log.sort((a, b) => b.data.localeCompare(a.data));
    lsSet('p_skiplog', log.slice(0, 200));
    return true;
  } catch (e) {
    console.warn('Lettura cloud fallita', e);
    return false;
  }
}

let AC = null;
function audioCtx() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
// su mobile l'audio va sbloccato da un tocco dell'utente
document.addEventListener('pointerdown', audioCtx, { once: true });

function beep(f, d) {
  const ctx = audioCtx();
  if (!ctx) return;
  try {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = f; o.type = 'sine';
    g.gain.setValueAtTime(0.3, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + d/1000);
    o.start(); o.stop(ctx.currentTime + d/1000);
  } catch(e) {}
}
function vibra(p) { if (navigator.vibrate) navigator.vibrate(p); }
function segnaleFinale() { beep(660,150); setTimeout(()=>beep(880,300),200); vibra([100,50,100,50,300]); }

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 2600);
}

function fmtSec(s) {
  s = Math.max(0, s);
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}

function apriGiorno(g) {
  S.giorno = g; S.exIdx = 0; S.riposaAdj = {};
  const d = loadDone(g);
  S.done = d.items; S.serie = d.serie;
  startSessionTimer(apriSessione(g).start);
  S.backStack = [goHome];
  // riparti dal primo esercizio non ancora fatto
  const i = GIORNI[g].esercizi.findIndex(e => !S.done[e.id]);
  if (i >= 0) S.exIdx = i;
  renderLista();
}

function renderLista() {
  fermaRiposo(); fermaExTimer();
  const G = GIORNI[S.giorno];
  setHeader(G.nome, '← Home');
  show('s-list');

  let html = '', sez = '';
  G.esercizi.forEach((ex, i) => {
    if (ex.sez !== sez) { sez = ex.sez; html += `<div class="sec-hdr">${esc(sez)}</div>`; }
    const voce = S.done[ex.id];
    const isDone = voce === 'done';
    const isSkip = voce && typeof voce === 'object' && voce.skip;
    const fatte = S.serie[ex.id] || 0;
    const badges = badgesHTML(ex, false);
    if (isSkip) badges.push(`<span class="bs-skip">⏭ SALTATO</span>`);
    html += `<div class="ex-row ${isDone?'done':''} ${isSkip?'skipped':''} ${i===S.exIdx?'current':''}" onclick="apriEx(${i})">
      <div class="er-num">${i+1}</div>
      <div class="er-info">
        <div class="er-name">${esc(ex.nome)}</div>
        <div class="er-detail">${ex.serie}× · ${esc(repsTarget(ex))}${ex.riposo_sec?' · ⏱'+ex.riposo_sec+'"':''}</div>
        ${badges.length?`<div class="er-badges">${badges.join('')}</div>`:''}
      </div>
      <div class="er-check">${isDone?'✅':isSkip?'⏭':fatte?`<span class="er-prog">${fatte}/${ex.serie}</span>`:'›'}</div>
    </div>`;
  });

  const nFatti = Object.keys(S.done).length;
  if (nFatti === G.esercizi.length) {
    html += `<div class="w-done show">
      <div style="font-size:56px;">🎉</div>
      <h2>Allenamento completato!</h2>
      <p>Ottimo lavoro Alberto!<br>Tutti i ${G.esercizi.length} esercizi completati.</p>
      <button class="btn-home-go" onclick="goHome()">Torna all'inizio</button>
    </div>`;
  }

  html += `<div style="text-align:center;padding:24px 16px 40px;">
    <button class="btn-reset-scheda" onclick="confermaResetScheda()">🔄 Reset scheda di oggi</button>
  </div>`;

  document.getElementById('s-list').innerHTML = html;
}

function confermaResetScheda() {
  if (!confirm('Sei sicuro di voler resettare la scheda di oggi?\n\nTutti gli esercizi completati o saltati torneranno "da fare".')) return;
  S.done = {}; S.serie = {};
  saveDone();
  renderLista();
  toast('🔄 Scheda resettata');
}

// =========================================================
// SCHERMATA ESERCIZIO
// =========================================================
function apriEx(idx) {
  S.exIdx = idx;
  fermaRiposo(); fermaExTimer();
  S.backStack = [renderLista];
  renderEx();
  window.scrollTo(0, 0);
}

function renderEx() {
  const G = GIORNI[S.giorno];
  const ex = G.esercizi[S.exIdx];
  if (S.postCountdown !== ex.id) S.postCountdown = null;
  if (ET.exId !== ex.id) initExTimer(ex);
  setHeader(`${S.exIdx+1} / ${G.esercizi.length}`, '← Lista');
  show('s-exercise');

  const tempo = isTempo(ex);
  const carichi = loadCarichi();
  const storiaEx = loadStoria()[ex.id] || [];
  const fatte = S.serie[ex.id] || 0;

  // peso corrente: da localStorage > suggerito dalla scheda
  const pesoAttuale = carichi[ex.id] !== undefined ? carichi[ex.id] : (ex.peso_suggerito_kg != null ? ex.peso_suggerito_kg : '');
  // reps correnti: da localStorage > limite alto del range
  const repsLS = loadReps();
  const repsAttuale = repsLS[ex.id] !== undefined ? repsLS[ex.id] : repsDefault(ex);

  // ultimo diverso da oggi per mostrare delta
  const ultimaDiversa = storiaEx.find(r => r.data !== oggi());
  const ultimo = ultimaDiversa ? ultimaDiversa.peso : (storiaEx[0] ? storiaEx[0].peso : null);

  const badges = badgesHTML(ex, true);

  const isPrima = S.exIdx === 0;
  const isUltima = S.exIdx === G.esercizi.length - 1;
  const voce = S.done[ex.id];
  const isDone = voce === 'done';
  const isSkip = voce && typeof voce === 'object' && voce.skip;
  const bloccato = isDone || isSkip;
  const r = getRiposa(ex);

  // Superset
  const p = partner(ex);
  let supersetHTML = '';
  if (p) {
    const primo = G.esercizi.indexOf(ex) < G.esercizi.indexOf(p);
    supersetHTML = `<div class="superset-block"><div class="ne-lbl">🔗 Superset</div>${primo
      ? `Fai subito dopo: <strong>${esc(p.nome)}</strong> — senza riposo`
      : `In coppia con <strong>${esc(p.nome)}</strong> — il riposo parte dopo questo esercizio`}</div>`;
  }

  // Countdown esercizi a tempo
  let timerHTML = '';
  if (tempo) {
    const running = ET.running && ET.exId === ex.id;
    const post = S.postCountdown === ex.id && !bloccato;
    let azioni;
    if (bloccato) azioni = `<div class="cd-done">${isDone ? '✅ Esercizio completato' : '⏭ Saltato'}</div>`;
    else if (post && r > 0) azioni = `
      <button class="btn-extimer" onclick="iniziaRiposo()">⏱ Inizia riposo ${r}"</button>
      <button class="btn-extimer secondary" onclick="avviaCountdown()">▶ Prossima serie (${fatte+1})</button>`;
    else azioni = `<button class="btn-extimer" onclick="avviaCountdown()">▶ ${post ? `Prossima serie (${fatte+1})` : 'Avvia timer'}</button>`;
    timerHTML = `
      <div class="ex-timer-block">
        <div class="sl">⏱ Timer esercizio</div>
        <div id="cd-idle" class="${running ? 'hidden' : ''}">
          ${bloccato ? '' : `
          <input type="number" inputmode="numeric" class="cd-input" id="cd-input" value="${ET.base}" min="5" onchange="salvaDurataInput()">
          <div class="cd-unit">secondi</div>`}
          <div class="cd-actions">${azioni}</div>
          ${ultimo ? `<div class="peso-storia" style="margin-top:10px">ultima volta: ${esc(ultimo)} sec</div>` : ''}
        </div>
        <div id="cd-run" class="${running ? '' : 'hidden'}">
          <div class="ex-timer-display" id="ex-timer-display">${fmtSec(ET.total)}</div>
          <div class="rp"><div class="rpb" id="cd-bar" style="width:100%"></div></div>
          <div class="cd-actions row">
            <button class="btn-plus15 big" onclick="piu15()">+15"</button>
            <button class="btn-skip" onclick="fineCountdown(true)">Salta</button>
          </div>
        </div>
      </div>`;
  }

  // Ripetizioni + carico (solo esercizi a ripetizioni)
  let infoRowHTML = '';
  if (!tempo) {
    const sugLabel = ex.peso_suggerito_kg ? `suggerito: ${ex.peso_suggerito_kg} kg` : 'peso libero';
    infoRowHTML = `
      <div class="info-row">
        <div class="ic">
          <div class="ic-lbl">Ripetizioni</div>
          <div class="ic-val"><input type="number" inputmode="numeric" id="inp-reps" value="${esc(repsAttuale)}" oninput="salvaReps()" onblur="salvaReps()"></div>
          <div class="ic-unit">obiettivo: ${esc(repsTarget(ex))}</div>
        </div>
        <div class="ic">
          <div class="ic-lbl">Carico (kg)</div>
          <div class="ic-val"><input type="number" inputmode="decimal" id="inp-peso" value="${esc(pesoAttuale)}" placeholder="–" oninput="salvaPeso()" onblur="salvaPeso()"></div>
          <div class="ic-unit">${sugLabel}</div>
          ${ultimo ? `<div class="peso-storia">↑ ultima volta: ${esc(ultimo)} kg</div>` : ''}
        </div>
      </div>`;
  }

  // Blocco "salta esercizio"
  let skipHTML = '';
  if (isSkip) {
    skipHTML = `<div class="skip-done-note">⏭ Esercizio saltato${voce.nota?': "'+esc(voce.nota)+'"':''}<button class="btn-undo-skip" onclick="annullaSalto()">↩ annulla</button></div>`;
  } else if (!isDone) {
    skipHTML = `
      <div class="skip-block">
        <button class="btn-skip-ex" onclick="toggleSkipForm()">↷ Salta esercizio</button>
        <div class="skip-form hidden" id="skip-form">
          <textarea id="skip-note" placeholder='Perché lo salti? (opzionale) — es. "dolore al gomito"'></textarea>
          <div class="skip-form-actions">
            <button class="nb" onclick="toggleSkipForm()">Annulla</button>
            <button class="nb primary" onclick="confermaSalto()">Conferma salto</button>
          </div>
        </div>
      </div>`;
  }

  // Prossimo esercizio
  const nex = G.esercizi[S.exIdx + 1];
  let nextHTML;
  if (nex) {
    const gruppo = nex.info ? nex.info.muscoli.split(',')[0].trim() : nex.sez;
    nextHTML = `<div class="next-ex-block"><div class="ne-lbl">PROSSIMO</div><div class="ne-name">${esc(nex.nome)}</div><div class="ne-muscoli">${esc(gruppo)} · ${nex.serie}×${esc(repsTarget(nex))}</div></div>`;
  } else {
    nextHTML = `<div class="next-ex-block"><div class="ne-lbl">PROSSIMO</div><div class="ne-name">🏁 Fine sessione</div></div>`;
  }

  document.getElementById('s-exercise').innerHTML = `
    <div class="ex-hdr">
      <h2>${esc(ex.nome)}</h2>
      ${badges.length?`<div class="bdg-row">${badges.join('')}</div>`:''}
      ${ex.note?`<div class="ex-note">${esc(ex.note)}</div>`:''}
    </div>
    <div class="ex-body">
      ${supersetHTML}
      ${ex.acquisto_necessario ? `<div class="banner-warn">🛒 ${esc(ex.note_acquisto || 'Attrezzo da acquistare')}</div>` : ''}
      <div class="series-block">
        <div class="sl">Serie completate · obiettivo ${esc(repsTarget(ex))}</div>
        <div class="sc">
          <button class="cbtn" onclick="cambiaSerie(-1)">−</button>
          <div class="sd"><span id="sn">${fatte}</span> / ${ex.serie}</div>
          <button class="cbtn" onclick="cambiaSerie(+1)">+</button>
        </div>
      </div>
      ${timerHTML}
      ${infoRowHTML}
      ${!bloccato && r > 0 ? `
      <div class="riposo-adj">
        <span class="riposo-adj-lbl">⏱ Riposo serie</span>
        <div class="riposo-adj-btns">
          <button class="btn-riposo-adj" onclick="setRiposaAdj(-5)">−</button>
          <span class="riposo-adj-val" id="riposa-adj-val">${r}"</span>
          <button class="btn-riposo-adj" onclick="setRiposaAdj(+5)">+</button>
        </div>
      </div>` : ''}
      ${!tempo || bloccato ? `<button class="btn-fs" id="btn-fs" onclick="fineSerie()" ${bloccato?'disabled':''}>${esc(labelFineSerie(ex))}</button>` : ''}
      <div class="rest-block ${S.restTimer ? 'active' : ''}" id="rest-block">
        <div class="rl">⏱ Riposo</div>
        <div class="rt" id="rt">0:00</div>
        <div class="rp"><div class="rpb" id="rpb" style="width:100%"></div></div>
        <button class="btn-skip" onclick="saltaRiposo()">Salta →</button>
      </div>
      ${skipHTML}
      <div class="ex-actions">
        ${ex.link_musclewiki ? `<a href="${esc(ex.link_musclewiki)}" target="_blank" rel="noopener" class="btn-vid">📹 Video</a>` : ''}
        ${ex.info ? `<button class="btn-info" onclick="apriInfo('${ex.id}')">ℹ️ Info</button>` : ''}
      </div>
      ${nextHTML}
    </div>
    <div class="nav-bar">
      <button class="nb" onclick="exPrec()" ${isPrima?'disabled':''}>← Prec.</button>
      <button class="nb primary" onclick="exSucc()">${isUltima?'Fine 🏁':'Succ. →'}</button>
    </div>
  `;
  tickRiposo();
}

// =========================================================
// LOGICA ESERCIZIO
// =========================================================
function salvaPeso() {
  const inp = document.getElementById('inp-peso');
  if (!inp || !S.giorno) return;
  const carichi = loadCarichi();
  carichi[exCorrente().id] = inp.value;
  saveCarichi(carichi);
}

function salvaReps() {
  const inp = document.getElementById('inp-reps');
  if (!inp || !S.giorno) return;
  const reps = loadReps();
  reps[exCorrente().id] = inp.value;
  saveReps(reps);
}

function salvaDurataInput() {
  const inp = document.getElementById('cd-input');
  const sec = parseInt(inp && inp.value);
  if (!sec || sec < 5) return;
  ET.base = sec;
  salvaDurata(exCorrente().id, sec);
}

// =========================================================
// RIPOSO / SERIE / SUPERSET
// =========================================================
function getRiposa(ex) { return S.riposaAdj[ex.id] != null ? S.riposaAdj[ex.id] : (ex.riposo_sec || 0); }

function setRiposaAdj(delta) {
  const ex = exCorrente();
  S.riposaAdj[ex.id] = Math.max(5, getRiposa(ex) + delta);
  const el = document.getElementById('riposa-adj-val');
  if (el) el.textContent = S.riposaAdj[ex.id] + '"';
  const btn = document.getElementById('btn-fs');
  if (btn && !btn.disabled) btn.textContent = labelFineSerie(ex);
}

// Secondi di riposo dopo aver completato la serie n (0 = nessun riposo)
function riposoDopo(ex, n) {
  const G = GIORNI[S.giorno];
  const p = partner(ex);
  const tuttoFatto = n >= ex.serie && (!p || S.done[p.id]);
  const ultimoIdx = Math.max(G.esercizi.indexOf(ex), p ? G.esercizi.indexOf(p) : -1);
  if (tuttoFatto && ultimoIdx === G.esercizi.length - 1) return 0; // fine sessione
  return getRiposa(ex);
}

// Nel superset si passa al compagno se è "indietro" di una serie
function vaiAlPartner(ex, n) {
  const p = partner(ex);
  return p && !S.done[p.id] && (S.serie[p.id] || 0) < n ? p : null;
}

function labelFineSerie(ex) {
  const v = S.done[ex.id];
  if (v === 'done') return '✅ Completato';
  if (v && v.skip) return '⏭ Saltato';
  const n = (S.serie[ex.id] || 0) + 1;
  const p = vaiAlPartner(ex, n);
  if (p) return `Fine serie ${n} → ${p.nome}`;
  const r = riposoDopo(ex, n);
  return r ? `Fine serie ${n} → riposo ${r}"` : `Fine serie ${n}`;
}

// 1) Azione immediata: conta la serie, salva peso/rip, toast. Il riposo è un'azione separata.
function completaSerie(ex, durata) {
  const n = Math.min(ex.serie, (S.serie[ex.id] || 0) + 1);
  S.serie[ex.id] = n;
  const finito = n >= ex.serie;
  if (finito) S.done[ex.id] = 'done';
  saveDone();

  let peso = null, rip = null;
  if (isTempo(ex)) {
    registraStoria(ex.id, durata, '', n);
  } else {
    const ip = document.getElementById('inp-peso'), ir = document.getElementById('inp-reps');
    peso = ip && ip.value !== '' ? parseFloat(ip.value) : null;
    rip = ir && ir.value !== '' ? parseInt(ir.value) : null;
    if (isNaN(peso)) peso = null;
    if (isNaN(rip)) rip = null;
    if (peso != null) registraStoria(ex.id, peso, rip != null ? rip : repsTarget(ex), n);
  }
  logSerie(ex, n, { peso, rip, durata: isTempo(ex) ? durata : null });

  toast(finito ? '✅ Esercizio completato!' : `✅ Serie ${n} completata`);
  renderEx();
  return n;
}

// 2) Dopo la serie: superset → compagno, altrimenti riposo
function dopoSerie(ex, n) {
  const G = GIORNI[S.giorno];
  const p = vaiAlPartner(ex, n);
  if (p) {
    apriEx(G.esercizi.indexOf(p));
    toast(`✅ Serie ${n} · ora ${p.nome}`);
    return;
  }
  const r = riposoDopo(ex, n);
  if (r <= 0) return;
  // superset: finito il riposo torna al primo esercizio della coppia ancora da fare
  let onEnd = null;
  const compagno = partner(ex);
  if (compagno) {
    const primo = [ex, compagno]
      .sort((a, b) => G.esercizi.indexOf(a) - G.esercizi.indexOf(b))
      .find(e => !S.done[e.id]);
    if (primo && primo !== ex) onEnd = () => apriEx(G.esercizi.indexOf(primo));
  }
  avviaRiposo(r, onEnd);
}

function fineSerie() {
  const ex = exCorrente();
  if (S.done[ex.id]) return;
  beep(660, 100);
  const n = completaSerie(ex);
  dopoSerie(ex, n);
}

// Correzione manuale del contatore (non registra serie)
function cambiaSerie(d) {
  const ex = exCorrente();
  const n = Math.max(0, Math.min(ex.serie, (S.serie[ex.id] || 0) + d));
  S.serie[ex.id] = n;
  if (n >= ex.serie) S.done[ex.id] = 'done';
  else if (S.done[ex.id] === 'done') delete S.done[ex.id];
  saveDone();
  renderEx();
}

// =========================================================
// SALTA ESERCIZIO
// =========================================================
function toggleSkipForm() {
  const f = document.getElementById('skip-form');
  if (f) f.classList.toggle('hidden');
}
function confermaSalto() {
  const ex = exCorrente();
  const noteEl = document.getElementById('skip-note');
  const nota = noteEl ? noteEl.value.trim() : '';
  S.done[ex.id] = { skip: true, nota };
  saveDone();
  logSkip(ex, nota);
  toast('⏭ Esercizio saltato');
  exSucc();
}
function annullaSalto() {
  const ex = exCorrente();
  delete S.done[ex.id];
  saveDone();
  renderEx();
}

// =========================================================
// INFO DRAWER
// =========================================================
function apriInfo(exId) {
  const ex = findEx(exId);
  if (!ex || !ex.info) return;

  const steps = ex.info.steps.map((s, i) => {
    const cls = s.includes('⚠️ TECNICA') ? 'tecnica-step'
      : s.includes('⚠️ LORDOSI') ? 'lordosi-step'
      : s.includes('⚠️ SPALLA') ? 'spalla-step'
      : s.includes('⚠️ GOLF') ? 'golf-step' : '';
    return `<li class="${cls}"><span class="step-n">${i+1}.</span><span>${esc(s)}</span></li>`;
  }).join('');

  document.getElementById('info-overlay').classList.remove('hidden');
  document.getElementById('info-drawer').innerHTML = `
    <div class="info-drawer-hdr">
      <div class="info-drawer-title">${esc(ex.nome)}</div>
      <button class="info-drawer-close" onclick="chiudiInfo()">✕</button>
    </div>
    <div class="info-muscoli">💪 ${esc(ex.info.muscoli)}</div>
    <ol class="info-steps">${steps}</ol>
  `;
}

function chiudiInfo() {
  document.getElementById('info-overlay').classList.add('hidden');
}

// =========================================================
// RIPOSO — timestamp assoluto: non si blocca se l'app va in background
// =========================================================
function avviaRiposo(sec, onEnd) {
  fermaRiposo();
  S.restTotal = sec;
  S.restEnd = Date.now() + sec * 1000;
  S.restOnEnd = onEnd || null;
  const rb = document.getElementById('rest-block');
  if (rb) rb.classList.add('active');
  S.restTimer = setInterval(tickRiposo, 250);
  tickRiposo();
}
function tickRiposo() {
  if (!S.restTimer) return;
  const s = Math.max(0, Math.ceil((S.restEnd - Date.now()) / 1000));
  const el = document.getElementById('rt'), bar = document.getElementById('rpb');
  if (el) {
    el.textContent = fmtSec(s);
    el.classList.toggle('ending', s<=10 && s>0);
  }
  if (bar && S.restTotal > 0) bar.style.width = (s/S.restTotal*100)+'%';
  if (s <= 0) {
    const cb = S.restOnEnd;
    fermaRiposo();
    segnaleFinale();
    toast('Riposo finito! 💪');
    if (cb) cb();
  }
}
function fermaRiposo() {
  clearInterval(S.restTimer); S.restTimer = null; S.restOnEnd = null;
  const rb = document.getElementById('rest-block');
  if (rb) rb.classList.remove('active');
}
function saltaRiposo() {
  const cb = S.restOnEnd;
  fermaRiposo();
  if (cb) cb();
}
function iniziaRiposo() {
  const ex = exCorrente();
  S.postCountdown = null;
  renderEx();
  avviaRiposo(getRiposa(ex));
}

// =========================================================
// COUNTDOWN ESERCIZI A TEMPO — timestamp assoluto
// =========================================================
function initExTimer(ex) {
  clearInterval(ET.interval);
  ET = { exId: ex.id, running: false, end: 0, total: 0, base: isTempo(ex) ? durataDefault(ex) : 0, startedAt: 0, interval: null };
}
function fermaExTimer() { clearInterval(ET.interval); ET.interval = null; ET.running = false; ET.exId = null; }

function avviaCountdown() {
  const ex = exCorrente();
  const inp = document.getElementById('cd-input');
  const sec = Math.max(5, parseInt(inp && inp.value) || ET.base || 30);
  ET.base = sec;
  salvaDurata(ex.id, sec);
  fermaRiposo();
  S.postCountdown = null;
  ET.exId = ex.id; ET.running = true; ET.total = sec;
  ET.startedAt = Date.now(); ET.end = ET.startedAt + sec * 1000;
  document.getElementById('cd-idle').classList.add('hidden');
  document.getElementById('cd-run').classList.remove('hidden');
  clearInterval(ET.interval);
  ET.interval = setInterval(tickCountdown, 250);
  tickCountdown();
}

function tickCountdown() {
  if (!ET.running) return;
  const ms = Math.max(0, ET.end - Date.now());
  const left = Math.ceil(ms / 1000);
  const disp = document.getElementById('ex-timer-display'), bar = document.getElementById('cd-bar');
  if (disp) { disp.textContent = fmtSec(left); disp.classList.toggle('zero', left <= 5); }
  if (bar) bar.style.width = (ms / (ET.total * 1000) * 100) + '%';
  if (left <= 0) fineCountdown(false);
}

function piu15() {
  if (!ET.running) return;
  ET.end += 15000; ET.total += 15;
  tickCountdown();
}

// Fine countdown (o "Salta"): segna la serie e torna al valore iniziale per la successiva
function fineCountdown(manuale) {
  if (!ET.running) return;
  const ex = findEx(ET.exId);
  const durata = manuale ? Math.min(ET.total, Math.round((Date.now() - ET.startedAt) / 1000)) : ET.total;
  clearInterval(ET.interval); ET.interval = null; ET.running = false;
  if (!manuale) segnaleFinale();
  if (!ex || !S.giorno) return;
  S.postCountdown = ex.id;
  completaSerie(ex, durata);
}

// =========================================================
// NAV ESERCIZI
// =========================================================
function exPrec() { if (S.exIdx>0) apriEx(S.exIdx - 1); }
function exSucc() {
  const G = GIORNI[S.giorno];
  if (S.exIdx < G.esercizi.length-1) apriEx(S.exIdx + 1);
  else { renderLista(); setTimeout(()=>window.scrollTo(0,9999),50); }
}

// =========================================================
// PROGRESSI
// =========================================================
const FILTRI = { sett: ['Ultima settimana', 7], mese: ['Ultimo mese', 30], tutto: ['Tutto', null] };
function filtraStoria(h) {
  const giorni = FILTRI[S.progFiltro][1];
  if (!giorni) return h;
  const da = giorniFa(giorni);
  return h.filter(r => r.data >= da);
}
function filtriHTML() {
  return `<div class="filter-row">${Object.entries(FILTRI).map(([k, [lbl]]) =>
    `<button class="fchip ${S.progFiltro===k?'active':''}" onclick="setFiltro('${k}')">${lbl}</button>`).join('')}</div>`;
}
function setFiltro(f) {
  S.progFiltro = f;
  if (S.progDettaglioId) renderDettaglio(S.progDettaglioId);
  else renderProgressi();
}

function apriProgressi() {
  S.backStack = [goHome];
  S.progTab = 'pesi'; S.progDettaglioId = null;
  setHeader('I miei progressi', '← Home');
  show('s-progress');
  renderProgressi();
  // online: aggiorna dal cloud e ridisegna
  aggiornaDaCloud().then(ok => {
    if (ok && S.screen === 's-progress' && !S.progDettaglioId) renderProgressi();
  });
}

function progTabsHTML() {
  const g = S.progGiorno, pesi = S.progTab === 'pesi';
  return `
    <div class="prog-tabs">
      ${Object.keys(GIORNI).map(k =>
        `<div class="ptab ${g===k&&pesi?'active':''}" onclick="S.progTab='pesi';S.progGiorno='${k}';renderProgressi()">Giorno ${k}</div>`).join('')}
      <div class="ptab ${!pesi?'active':''}" onclick="S.progTab='salti';renderProgressi()">⏭ Salti</div>
    </div>
    ${filtriHTML()}`;
}

function healthConnectHTML() {
  return `
    <div class="hc-block">
      <label class="hc-row"><span>🏃 Connetti smartwatch</span><input type="checkbox" class="switch" disabled ${HEALTH_CONNECT.enabled?'checked':''}></label>
      <div class="hc-note">Disponibile con smartwatch Android compatibile con Health Connect (Pixel Watch, Galaxy Watch, Garmin con Android).</div>
    </div>
    ${HEALTH_CONNECT.enabled ? `
    <div class="prog-list" style="margin-top:12px;">
      <div class="pd-chart"><div class="pd-chart-title">Dati smartwatch</div><div class="pd-empty">Nessun dato.</div></div>
    </div>` : ''}`;
}

function renderProgressi() {
  if (S.progTab === 'salti') { renderSalti(); return; }

  const storia = loadStoria();
  const G = GIORNI[S.progGiorno];

  let html = progTabsHTML() + `<div class="prog-list">`;
  let tracciati = 0;

  G.esercizi.filter(ex => !ex.warm).forEach(ex => {
    const h = filtraStoria(storia[ex.id] || []);
    if (!h.length) return;
    tracciati++;
    const u = unita(ex);
    const latest = parseFloat(h[0].peso) || 0;
    const prev = h[1] ? parseFloat(h[1].peso) || 0 : null;
    let deltaHTML = '';
    if (prev !== null && latest !== prev) {
      const d = Math.round((latest - prev) * 10) / 10;
      deltaHTML = `<span class="pc-delta ${d>0?'up':'down'}">${d>0?'↑':'↓'} ${Math.abs(d)} ${u} vs prec.</span>`;
    } else if (prev !== null) {
      deltaHTML = `<span class="pc-delta same">= stabile</span>`;
    }
    const sparkSVG = makeSpark(h.slice(0,8).reverse().map(r=>parseFloat(r.peso)||0));
    html += `
      <div class="prog-card" onclick="apriDettaglio('${ex.id}')">
        <div class="pc-name">${esc(ex.nome)}</div>
        <div class="pc-meta">${h.length} sessione${h.length>1?'i':''} · ultima: ${fmtData(h[0].data)}</div>
        <div><span class="pc-latest">${latest} ${u}</span>${deltaHTML}</div>
        <div class="sparkline">${sparkSVG}</div>
      </div>`;
  });

  if (!tracciati) {
    html += `<div class="pd-empty">Nessun dato${S.progFiltro!=='tutto'?' in questo periodo':' ancora'}.<br>Completa qualche esercizio e i tuoi progressi appariranno qui.</div>`;
  }

  html += `</div>` + healthConnectHTML();
  document.getElementById('s-progress').innerHTML = html;
}

function renderSalti() {
  const log = filtraStoria(loadSkipLog());
  let html = progTabsHTML() + `<div class="prog-list">`;

  if (!log.length) {
    html += `<div class="pd-empty">Nessun esercizio saltato${S.progFiltro!=='tutto'?' in questo periodo':' finora'}.</div>`;
  } else {
    log.forEach(s => {
      html += `
        <div class="prog-card" style="cursor:default;">
          <div class="pc-name">${esc(s.nome)} <span style="color:var(--text2);font-weight:400;font-size:12px;">— Giorno ${esc(s.giorno)}</span></div>
          <div class="pc-meta">${fmtData(s.data)}</div>
          ${s.nota?`<div style="font-size:13px;color:var(--text2);margin-top:4px;">"${esc(s.nota)}"</div>`:''}
        </div>`;
    });
  }

  html += `</div>`;
  document.getElementById('s-progress').innerHTML = html;
}

function apriDettaglio(exId) {
  S.progDettaglioId = exId;
  S.backStack.push(() => { S.progDettaglioId=null; setHeader('I miei progressi', '← Home'); renderProgressi(); });
  renderDettaglio(exId);
}

function renderDettaglio(exId) {
  const ex = findEx(exId);
  const u = ex ? unita(ex) : 'kg';
  setHeader(ex ? ex.nome : exId, '← Progressi');

  const h = filtraStoria(loadStoria()[exId] || []);
  if (!h.length) {
    document.getElementById('s-progress').innerHTML = `<div style="padding-top:14px;">${filtriHTML()}</div><div class="pd-empty">Nessun dato per questo esercizio in questo periodo.</div>`;
    return;
  }

  const chartSVG = makeBarChart(h.slice(0,10).reverse());
  const rows = h.map(r =>
    `<tr><td>${fmtData(r.data)}</td><td><strong>${esc(r.peso)} ${u}</strong></td><td style="color:var(--text2)">${esc(r.rip || '–')}</td></tr>`
  ).join('');

  document.getElementById('s-progress').innerHTML = `
    <div style="padding-top:14px;">${filtriHTML()}</div>
    <div style="padding:0 16px;">
      <div class="pd-chart">
        <div class="pd-chart-title">Progressione ${u==='sec'?'tempo':'peso'} (ultime 10 sessioni)</div>
        ${chartSVG}
      </div>
      <table class="pd-table">
        <thead><tr><th>Data</th><th>${u==='sec'?'Tempo':'Peso'}</th><th>Rip.</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div style="margin-top:16px;text-align:center;">
        <button class="btn-reset" onclick="resetStoriaEx('${exId}')">🗑 Cancella storico</button>
      </div>
    </div>`;
}

function resetStoriaEx(exId) {
  if (!confirm('Cancellare tutto lo storico locale per questo esercizio?')) return;
  const st = loadStoria();
  delete st[exId];
  saveStoria(st);
  S.backStack.pop();
  S.progDettaglioId = null;
  setHeader('I miei progressi', '← Home');
  renderProgressi();
  toast('Storico cancellato');
}

// =========================================================
// GRAFICI SVG
// =========================================================
function makeSpark(vals) {
  if (!vals.length) return '';
  const W=180, H=30, pad=2;
  const min=Math.min(...vals), max=Math.max(...vals);
  const range = max-min || 1;
  const pts = vals.map((v,i)=>{
    const x = pad + i*(W-2*pad)/(vals.length-1||1);
    const y = H-pad-(v-min)/range*(H-2*pad);
    return `${x},${y}`;
  }).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="overflow:visible">
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${vals.map((v,i)=>{
      const x=pad+i*(W-2*pad)/(vals.length-1||1);
      const y=H-pad-(v-min)/range*(H-2*pad);
      return `<circle cx="${x}" cy="${y}" r="3" fill="var(--accent)"/>`;
    }).join('')}
  </svg>`;
}

function makeBarChart(entries) {
  if (!entries.length) return '';
  const W=340, H=120, padL=34, padB=28, padT=10, padR=8;
  const pesi = entries.map(e=>parseFloat(e.peso)||0);
  const maxP = Math.max(...pesi)||1;
  const bw = (W-padL-padR)/entries.length;
  const barW = Math.max(4, bw-6);

  let bars = '', labels = '';
  entries.forEach((e,i) => {
    const p = parseFloat(e.peso)||0;
    const bh = (p/maxP)*(H-padT-padB);
    const x = padL + i*bw + (bw-barW)/2;
    const y = H-padB-bh;
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${bh}" rx="3" fill="var(--accent)" opacity="0.85"/>`;
    bars += `<text x="${x+barW/2}" y="${y-4}" text-anchor="middle" font-size="10" fill="var(--text)">${p}</text>`;
    const dateShort = e.data.slice(5); // MM-DD
    labels += `<text x="${x+barW/2}" y="${H-padB+14}" text-anchor="middle" font-size="9" fill="var(--text2)">${dateShort}</text>`;
  });

  // Asse Y
  let yAxis = '';
  [0, 0.5, 1].forEach(f => {
    const val = Math.round(maxP*f);
    const y = H-padB-(f*(H-padT-padB));
    yAxis += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--bg3)" stroke-width="1"/>`;
    yAxis += `<text x="${padL-4}" y="${y+4}" text-anchor="end" font-size="9" fill="var(--text2)">${val}</text>`;
  });

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;overflow:visible">
    ${yAxis}${bars}${labels}
  </svg>`;
}

function fmtData(iso) {
  if (!iso) return '–';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

// =========================================================
// AVVIO
// =========================================================
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

loadScheda();
</script>
